name: support-incident-lab
services:
  app:
    build: ./app
    read_only: true
    tmpfs:
      - /data:size=1048576,uid=10001,gid=10001,mode=0700
      - /control:size=65536,uid=10001,gid=10001,mode=0700
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
  proxy:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
